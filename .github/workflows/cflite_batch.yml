name: ClusterFuzzLite batch fuzzing
on:
  schedule:
    - cron: '37 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # SARIF upload only; fork PR tokens remain read-only and skip this step.
      security-events: write
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          language: rust
          sanitizer: address
          keep-unaffected-fuzz-targets: true
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          language: rust
          sanitizer: address
          mode: batch
          fuzz-seconds: 1800
          parallel-fuzzing: false
          output-sarif: true
      - name: Upload crash SARIF where code-scanning permissions allow it
        if: always() && hashFiles('cifuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite-batch
