name: kernel-abi-tools
# Focused workspace Rust/CLI and kernel simulation checks. Provider builds
# remain in their separate workflows.
on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - tests/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kernel-abi-tools*.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kernel-abi-tools*.yml
permissions:
  contents: read
env:
  CRATES: --workspace
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - shell: bash
        run: cargo test $CRATES --all-targets --locked --offline
      - shell: bash
        run: cargo clippy $CRATES --all-targets --locked --offline -- -D warnings
      - name: Workspace doctests
        run: cargo test --workspace --doc --locked --offline
      - name: Root CLI without default features
        run: cargo test -p libc-abi-tools --all-targets --locked --offline --no-default-features
      - name: Committed profiles match the data
        shell: bash
        working-directory: crates/kernel-abi-tools
        run: |
          cargo run -p kernel-abi-tools --release --locked --offline --bin kernel-seccomp -- generate profiles
          git diff --exit-code -- profiles
  kernel-simulation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/kernel-abi-tools
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo fetch --locked
      - run: shellcheck -S warning scripts/*.sh
      - name: Build the static musl probe and the generator
        run: |
          cargo build --release --locked --offline --target x86_64-unknown-linux-musl -p kernel-abi-tools --bin syscall-probe
          cargo build --release --locked --offline -p kernel-abi-tools --bin kernel-seccomp
          echo "PROBE=$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/syscall-probe" >> "$GITHUB_ENV"
      - name: Self-test every profile with the local filter (host userland, no root)
        run: >-
          bash scripts/self-test.sh "$PROBE" local
          $(cd profiles/kernel && ls | sed 's/^linux-//; s/\.json$//' | sort -V)
          $(cd profiles/distro && ls | sed 's/\.json$//')
      - name: Static crun (libseccomp that names every syscall)
        run: bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
      - name: Docker and Podman stdin, environment and exit status
        run: bash scripts/container-io-test.sh "$GITHUB_WORKSPACE/target/release/kernel-seccomp" "$RUNNER_TEMP/crun"
      - name: Self-test every profile in SLES 12 SP5 userland
        env:
          KERNEL_ABI_ENGINE_ARGS: --runtime ${{ runner.temp }}/crun
        run: >-
          bash scripts/self-test.sh "$PROBE"
          registry.suse.com/suse/sles12sp5:latest
          $(cd profiles/kernel && ls | sed 's/^linux-//; s/\.json$//' | sort -V)
          sles-12-sp5 rhel-7 ubuntu-24.04
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo fetch --locked
      - run: cargo check --workspace --all-targets --locked --offline
      - name: Accept official Rust 1.90 Cargo and compiler ELF files
        shell: bash
        run: |
          sysroot=$(rustc --print sysroot)
          drivers=("$sysroot"/lib/librustc_driver-*.so)
          export LINUX_ABI_SCAN_CARGO_ELF="$sysroot/bin/cargo"
          export LINUX_ABI_SCAN_RUSTC_DRIVER_ELF="${drivers[0]}"
          cargo test -p linux-abi-scan --test toolchain_elf --locked --offline -- --ignored --nocapture
