name: ClusterFuzzLite pr fuzzing
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**/src/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_*.yml'
      - 'scripts/build-test-fixtures.py'
      - 'scripts/seed-fuzz-corpus.py'
      - 'tests/fixtures/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fuzz:
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # SARIF upload only; fork PR tokens remain read-only and skip this step.
      security-events: write
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          language: rust
          sanitizer: address
          keep-unaffected-fuzz-targets: true
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          language: rust
          sanitizer: address
          mode: code-change
          fuzz-seconds: 300
          parallel-fuzzing: false
          output-sarif: true
      - name: Upload crash SARIF where code-scanning permissions allow it
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('cifuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite-pr
