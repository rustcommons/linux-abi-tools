version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    # These SHA-pinned refs select compiler versions. Review them manually so
    # action updates cannot silently replace the MSRV/publishing toolchain.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
